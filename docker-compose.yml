# TrustPass — laptop-friendly dev compose (refined in Stage 6).
# Usage: docker compose up   (then open http://localhost:5173)
services:
  chain:
    image: node:20-alpine
    working_dir: /chain
    volumes:
      - ./blockchain:/chain
    command: sh -c "npm install && npx hardhat node"
    ports:
      - "8545:8545"

  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: sqlite:////app/trustpass.db
      CHAIN_RPC_URL: http://chain:8545
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    command: sh -c "pip install -e . && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - chain

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - backend
