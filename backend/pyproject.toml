[project]
name = "attesta-backend"
version = "0.1.0"
description = "Attesta — verified credentials for students (FastAPI backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0.1,<4.1",
    "PyJWT>=2.9",
    "httpx>=0.27",
    "email-validator>=2.0",
    "fpdf2>=2.7",  # demo-mode PDF generation (seed + CSV bulk issuance)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
extraction = [
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
chain = [
    "web3>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pragmatic set for FastAPI + SQLAlchemy: correctness, imports, basic safety.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "TRY", "BLE", "S", "C4"]
ignore = [
    "B008",    # FastAPI: Depends/File/Form callables in defaults are idiomatic
    "BLE001",  # broad except is deliberate around fallbacks and the chain adapter
    "DTZ011",  # certificate PDFs use local date.today() on purpose
    "SIM115",  # streaming file reads use explicit scoped open/close lifecycles
    "S105", "S106",  # demo password constants are public by design (DEMO_PASSWORD)
    "TRY003",  # long exception messages are the point of ChainError/FileRejected
    "UP042",   # (str, Enum) is kept deliberately so .value stays explicit
    "S603",    # subprocess calls use fixed, app-generated arg lists
    "S104",    # 0.0.0.0 bind is required inside containers/serverless
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]  # asserts are how tests work; fake stored paths are strings
